name: WordCrushMania
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
packages:
  GameCore:
    path: .
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.12.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  WordCrushMania:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corticallabs.wordcrushmania.ios
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        OTHER_LDFLAGS: ['$(inherited)', '-ObjC']
    dependencies:
      - package: GameCore
        product: GameCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
  WordCrushManiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corticallabs.wordcrushmania.ios.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: WordCrushMania
schemes:
  WordCrushMania:
    build:
      targets:
        WordCrushMania: all
        WordCrushManiaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WordCrushManiaUITests
    archive:
      config: Release
