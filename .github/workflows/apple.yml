name: Apple validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_campaign:
        description: Validate all 10,000 generated levels
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        env:
          WCM_VALIDATE_CAMPAIGN: ${{ inputs.full_campaign && '1' || '0' }}
        run: swift test -c release --parallel
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Select simulator
        id: simulator
        run: echo "id=$(python3 Scripts/select_simulator.py '${{ matrix.family }}')" >> "$GITHUB_OUTPUT"
      - name: Build and run UI test
        run: |
          xcodebuild test -project WordCrushMania.xcodeproj -scheme WordCrushMania \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -resultBundlePath 'artifacts/${{ matrix.family }}.xcresult' CODE_SIGNING_ALLOWED=NO
      - name: Compile Release for iOS
        run: |
          xcodebuild build -project WordCrushMania.xcodeproj -scheme WordCrushMania \
            -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apple-${{ matrix.family }}
          path: artifacts/
